<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0e0d" />
    <title>Elsewhen</title>
    <meta name="description" content="A window through time: see where you stand from a million years ago to a million years ahead." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <section id="landing" class="screen">
      <div class="landing-inner">
        <h1 class="wordmark">Elsewhen</h1>
        <p class="tagline">A window through time. See where you stand, from a million years ago to a million years ahead.</p>
        <div class="actions">
          <button id="open-camera" class="primary">Try it where you are</button>
          <label class="secondary file-button">Choose a photo<input id="file" type="file" accept="image/*" hidden /></label>
        </div>
        <p class="fine">Works best outdoors. Your photo is used only to paint this scene.</p>
      </div>
    </section>

    <section id="camera" class="screen" hidden>
      <video id="video" playsinline muted autoplay></video>
      <div class="camera-bar">
        <button id="camera-cancel" class="ghost">Cancel</button>
        <button id="shutter" class="shutter" aria-label="Capture"></button>
        <span class="spacer"></span>
      </div>
    </section>

    <section id="viewer" class="screen" hidden>
      <canvas id="canvas"></canvas>
      <button id="hint" class="hint" aria-label="Learn about this" hidden></button>

      <header class="topbar">
        <span class="wordmark small">Elsewhen</span>
        <div class="topbar-actions">
          <label class="chip" title="Region used for the deep past and far future">
            <span class="chip-label">Biome</span>
            <select id="biome">
              <option value="temperate">Temperate</option>
              <option value="arid">Arid</option>
              <option value="tropical">Tropical</option>
              <option value="cold">Cold</option>
            </select>
          </label>
          <button id="tilt" class="chip" hidden>Tilt to look around</button>
          <button id="new-place" class="chip">New place</button>
        </div>
      </header>

      <footer class="timebar">
        <div id="status" class="status" aria-live="polite"></div>
        <div class="era">
          <div id="era-year" class="era-year">now</div>
          <div id="era-caption" class="era-caption"></div>
        </div>
        <div class="slider-wrap">
          <div id="ticks" class="ticks"></div>
          <input id="slider" type="range" min="-1" max="1" step="0.0005" value="0" aria-label="Time" />
          <div class="slider-ends"><span>1M years ago</span><span>now</span><span>in 1M years</span></div>
        </div>
      </footer>

      <div id="toast" class="toast" hidden></div>
      <div id="turnstile" class="turnstile"></div>
    </section>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true">
        <button id="sheet-close" class="sheet-close" aria-label="Close">×</button>
        <div id="sheet-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
